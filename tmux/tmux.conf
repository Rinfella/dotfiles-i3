# ~/.config/tmux/tmux.conf

# ====== GENERAL SETTINGS ======

# Set default terminal to support 256 colors and true color
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',*:RGB'
set-option -ga terminal-overrides ",xterm*:Tc:smcup@:rmcup@"
set-option -ga terminal-overrides ",screen*:Tc:smcup@:rmcup@"
set-option -ga terminal-overrides ",tmux*:Tc:smcup@:rmcup@"

# Set zsh as default shell
set -g default-shell /usr/bin/zsh
# Enable mouse support
set -g mouse on

# UTF-8 support (essential for Nerd Font symbols)
set -gq utf8 on
set-window-option -gq utf8 on

# Set history limit
set-option -g history-limit 50000

# Fix escape key delay
set -sg escape-time 0

# Start windows and panes at index 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# ====== KEY BINDINGS ======

# Change prefix from Ctrl-b to Ctrl-a (optional but popular)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload configuration
bind O source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Update plugins
bind U run '~/.config/tmux/plugins/tpm/bin/update_plugins all' \; display-message "Plugins updated!"

# Clean removed plugins
bind C-u run '~/.config/tmux/plugins/tpm/bin/clean_plugins' \; display-message "Plugins cleaned!"

# Split panes using | and -
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Switch panes using Alt-arrow without prefix
# bind -n M-h select-pane -L
# bind -n M-l select-pane -R
# bind -n M-k select-pane -U
# bind -n M-j select-pane -D

# Switch windows using Shift-arrow without prefix
bind -n C-S-H previous-window
bind -n C-S-R next-window

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-like pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode override
set -g @override_copy_command 'xclip -selection clipboard'

# Copy mode with vi keys
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy' # macOS
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard' # Linux

# ====== SESSION MANAGEMENT KEY BINDINGS ======

# Create new session with prompt for name
bind n command-prompt -p "New session name:" "new-session -s '%%'"
# Kill current session with confirmation
bind X confirm-before -p "Kill current session? (y/n)" kill-session
# Rename current session
bind r command-prompt -I "#S" -p "Rename session to:" "rename-session '%%'"
# Restore a session
bind R run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh' \; display-message "Session restored!"
# Save a session using tmux-resurrect script
bind S run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh' \; display-message "Session saved!"
# List sessions
bind s choose-session

# Set sainnhe/tmux-fzf launch key to Prefix + F
TMUX_FZF_LAUNCH_KEY="F"

# Fuzzy Project Session Switcher (Prefix + P)
# Searches ~/projects, ~/.config, and active sessions, auto-attaching or creating on the fly
bind P display-popup -E -w 75% -h 60% "\
  selected=\$( (tmux list-sessions -F '#S' 2>/dev/null; fd --min-depth 1 --max-depth 2 --type d . ~/projects ~/.config 2>/dev/null) | fzf --reverse --prompt='Tmux Project > ' --border=rounded ); \
  if [ -n \"\$selected\" ]; then \
    if tmux has-session -t \"\$selected\" 2>/dev/null; then \
      tmux switch-client -t \"\$selected\"; \
    else \
      session_name=\$(basename \"\$selected\" | tr . _); \
      tmux new-session -d -s \"\$session_name\" -c \"\$selected\" 2>/dev/null; \
      tmux switch-client -t \"\$session_name\"; \
    fi; \
  fi"
# ====== APPEARANCE ======

# Status bar position
set -g status-position top
set -g status-interval 1
set -g status-justify centre

# Status bar colors (Catppuccin Mocha baseline)
set -g status-style bg=#1e1e2e,fg=#cdd6f4

# Left status with Nerd Font icons
set -g status-left-length 100
set -g status-left "#[fg=#89b4fa,bg=#313244,bold]  #{session_name} #[fg=#313244,bg=#1e1e2e]"

# Window status format
set -g window-status-separator ""
set -g window-status-format "#[fg=#6c7086,bg=#181825] #I:#W "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W #[fg=#89b4fa,bg=#1e1e2e]"

# Right status with system info
set -g status-right-length 100
set -g status-right "#[fg=#89b4fa,bg=#313244]  %H:%M #[fg=#cdd6f4,bg=#45475a]  %Y-%m-%d  "

# Pane borders
set -g pane-border-style fg=#313244
set -g pane-active-border-style fg=#89b4fa

# Message styling
set -g message-style "fg=#cdd6f4,bg=#313244,align=left"
set -g message-command-style "fg=#cdd6f4,bg=#313244,align=left"

# ====== PLUGIN MANAGER SETUP ======

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'

# ====== PLUGIN CONFIGURATIONS ======

# tmux-resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum settings
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'

# Auto-install TPM if not present
if-shell "test ! -d ~/.config/tmux/plugins/tpm" \
   "run-shell 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# Override Catppuccin's transparent centered message style to prevent overlapping with window tabs
set -g message-style "fg=#94e2d5,bg=#1e1e2e,align=left"
set -g message-command-style "fg=#94e2d5,bg=#1e1e2e,align=left"


