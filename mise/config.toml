# ~/.config/doti3/mise/config.toml
# mise global config: runtimes, dotfiles, and tasks
# See: https://mise.jdx.dev
#
# Symlinked to ~/.config/mise/config.toml via deploy.sh (legacy) or mise dot apply
#
# Runtimes
# python left as system pacman (too many system dependents)
# thefuck left as system pacman (python-based, no mise plugin)

[tools]
# languages / runtimes
php    = "8.5"
node   = "24"
gradle = "9.4.1"
go     = "latest"
deno   = "latest"

# CLI tools (managed by mise, removed from pacman)
atuin      = "latest"
bat        = "latest"
delta      = "latest"
direnv     = "latest"
duf        = "latest"
eza        = "latest"
glow       = "latest"
lazydocker = "latest"
lazygit    = "latest"
navi       = "latest"
neovim     = "latest"
starship   = "latest"
fastfetch  = "latest"
yazi       = "latest"
yt-dlp     = "latest"
zoxide     = "latest"

[settings]
experimental = true
jobs = 4
disable_backends = ["asdf"]
dotfiles.root = "~/.config/doti3"

# -----------------------------------------------------------------------------
# Dotfiles — symlinks managed by `mise dot apply`
# Source paths are relative to dotfiles.root (~/.config/doti3)
# On a fresh machine: mise dot apply creates these symlinks
# On current machine: already exist, mise dot apply is a no-op
# -----------------------------------------------------------------------------

[dotfiles]
# Home directory files
"~/.zshenv"       = { source = "~/.config/doti3/zsh/.zshenv", mode = "symlink" }
"~/.screenlayout" = { source = "~/.config/doti3/screenlayout", mode = "symlink" }

# XDG_CONFIG_HOME flat files
"~/.config/starship.toml"          = { source = "~/.config/doti3/starship.toml", mode = "symlink" }
"~/.config/.curlrc"                = { source = "~/.config/doti3/curlrc", mode = "symlink" }
"~/.config/wgetrc"                 = { source = "~/.config/doti3/wgetrc", mode = "symlink" }
"~/.config/inputrc"                = { source = "~/.config/doti3/inputrc", mode = "symlink" }
"~/.config/npmrc"                  = { source = "~/.config/doti3/npmrc", mode = "symlink" }
"~/.config/yarnrc"                 = { source = "~/.config/doti3/yarnrc", mode = "symlink" }
"~/.config/gitconfig"              = { source = "~/.config/doti3/gitconfig", mode = "symlink" }
"~/.config/mimeapps.list"          = { source = "~/.config/doti3/mimeapps.list", mode = "symlink" }
"~/.config/pavucontrol.ini"        = { source = "~/.config/doti3/pavucontrol.ini", mode = "symlink" }
"~/.config/composer/composer.json" = { source = "~/.config/doti3/composer/composer.json", mode = "symlink" }
"~/.config/composer/composer.lock" = { source = "~/.config/doti3/composer/composer.lock", mode = "symlink" }

# XDG_CONFIG_HOME directories
"~/.config/ai"          = { source = "~/.config/doti3/ai", mode = "symlink" }
"~/.config/alacritty"   = { source = "~/.config/doti3/alacritty", mode = "symlink" }
"~/.config/atuin"       = { source = "~/.config/doti3/atuin", mode = "symlink" }
"~/.config/autostart"   = { source = "~/.config/doti3/autostart", mode = "symlink" }
"~/.config/bat"         = { source = "~/.config/doti3/bat", mode = "symlink" }
"~/.config/dunst"       = { source = "~/.config/doti3/dunst", mode = "symlink" }
"~/.config/fastfetch"   = { source = "~/.config/doti3/fastfetch", mode = "symlink" }
"~/.config/fontconfig"  = { source = "~/.config/doti3/fontconfig", mode = "symlink" }
"~/.config/git"         = { source = "~/.config/doti3/git", mode = "symlink" }
"~/.config/gtk-2.0"     = { source = "~/.config/doti3/gtk-2.0", mode = "symlink" }
"~/.config/gtk-3.0"     = { source = "~/.config/doti3/gtk-3.0", mode = "symlink" }
"~/.config/gtk-4.0"     = { source = "~/.config/doti3/gtk-4.0", mode = "symlink" }
"~/.config/i3"          = { source = "~/.config/doti3/i3", mode = "symlink" }
"~/.config/kitty"       = { source = "~/.config/doti3/kitty", mode = "symlink" }
"~/.config/lazygit"     = { source = "~/.config/doti3/lazygit", mode = "symlink" }
"~/.config/mise"        = { source = "~/.config/doti3/mise", mode = "symlink" }
"~/.config/nvim"        = { source = "~/.config/doti3/nvim", mode = "symlink" }
"~/.config/nwg-look"    = { source = "~/.config/doti3/nwg-look", mode = "symlink" }
"~/.config/opencode"    = { source = "~/.config/doti3/opencode", mode = "symlink" }
"~/.config/picom"       = { source = "~/.config/doti3/picom", mode = "symlink" }
"~/.config/polybar"     = { source = "~/.config/doti3/polybar", mode = "symlink" }
"~/.config/rbw"         = { source = "~/.config/doti3/rbw", mode = "symlink" }
"~/.config/ripgrep"     = { source = "~/.config/doti3/ripgrep", mode = "symlink" }
"~/.config/rofi"        = { source = "~/.config/doti3/rofi", mode = "symlink" }
"~/.config/systemd"     = { source = "~/.config/doti3/systemd", mode = "symlink" }
"~/.config/tmux"        = { source = "~/.config/doti3/tmux", mode = "symlink" }
"~/.config/vim"         = { source = "~/.config/doti3/vim", mode = "symlink" }
"~/.config/wireplumber" = { source = "~/.config/doti3/wireplumber", mode = "symlink" }
"~/.config/X11"         = { source = "~/.config/doti3/X11", mode = "symlink" }
"~/.config/xsettingsd"  = { source = "~/.config/doti3/xsettingsd", mode = "symlink" }
"~/.config/yazi"        = { source = "~/.config/doti3/yazi", mode = "symlink" }
